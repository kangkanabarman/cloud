version: 1.0
runtime: nodejs22
build:
  commands:
    build:
      - npm install
run:
  command: node server.js
  network:
    port: 3000
    env: APP_PORT
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "3000"
    - name: DATABASE_TYPE
      value: sqlite
    - name: DATABASE_PATH
      value: ./database/medicloud.sqlite
    - name: BACKUP_DIRECTORY
      value: ./data/backups
    - name: TRUST_PROXY
      value: "true"
